<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#070d19" />
    </linearGradient>
    <linearGradient id="topFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="frontFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="12" />
  
  <!-- 3D Box Icon -->
  <polygon points="256,120 380,180 256,240 132,180" fill="url(#topFace)" stroke="#7dd3fc" stroke-width="4" />
  <polygon points="132,180 256,240 256,360 132,300" fill="url(#frontFace)" stroke="#3b82f6" stroke-width="4" />
  <polygon points="256,240 380,180 380,300 256,360" fill="#1d4ed8" stroke="#2563eb" stroke-width="4" />

  <!-- Corner Reticle -->
  <path d="M 140,150 L 110,150 L 110,180" fill="none" stroke="#22d3ee" stroke-width="12" stroke-linecap="round" />
  <path d="M 372,150 L 402,150 L 402,180" fill="none" stroke="#22d3ee" stroke-width="12" stroke-linecap="round" />
  <path d="M 110,290 L 110,320 L 140,320" fill="none" stroke="#ef4444" stroke-width="12" stroke-linecap="round" />
  <path d="M 402,290 L 402,320 L 372,320" fill="none" stroke="#ef4444" stroke-width="12" stroke-linecap="round" />
</svg>