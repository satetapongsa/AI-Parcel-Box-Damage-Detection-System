# SPDI - Mosquitto 2.x config
# Mosquitto 2.x only listens on localhost and refuses anonymous clients
# unless you configure a listener explicitly. This file opens port 1883.
#
# SECURITY: 0.0.0.0 + anonymous = anyone on the same Wi-Fi can publish/subscribe.
# OK for a classroom demo. If CiRA runs on the SAME laptop, change to:
#   listener 1883 127.0.0.1

listener 1883 0.0.0.0
allow_anonymous true

persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
