<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Shield Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="50%" stop-color="#0f1a36" />
      <stop offset="100%" stop-color="#070d19" />
    </linearGradient>

    <!-- Box Face Gradients -->
    <linearGradient id="topFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="frontFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="sideFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Laser Beam Gradient -->
    <linearGradient id="laserBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0" />
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="1" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Container with Cyan Glow Border -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="8" opacity="0.95" />

  <!-- Outer HUD Ring & Crosshairs -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#26344A" stroke-width="4" stroke-dasharray="12 12" />
  <circle cx="256" cy="256" r="190" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.4" />

  <!-- 3D Isometric Cardboard Box -->
  <g transform="translate(0, 10)">
    <!-- Box Shadow -->
    <ellipse cx="256" cy="380" rx="140" ry="30" fill="#000000" opacity="0.6" filter="url(#glow)" />

    <!-- Top Face -->
    <polygon points="256,120 380,180 256,240 132,180" fill="url(#topFace)" stroke="#7dd3fc" stroke-width="4" />
    
    <!-- Left/Front Face -->
    <polygon points="132,180 256,240 256,360 132,300" fill="url(#frontFace)" stroke="#3b82f6" stroke-width="4" />
    
    <!-- Right/Side Face -->
    <polygon points="256,240 380,180 380,300 256,360" fill="url(#sideFace)" stroke="#2563eb" stroke-width="4" />

    <!-- Tape Seam -->
    <polygon points="256,120 318,150 256,180 194,150" fill="#0284c7" opacity="0.8" />
    <line x1="256" y1="240" x2="256" y2="360" stroke="#3b82f6" stroke-width="4" opacity="0.8" />

    <!-- AI Damage Inspection Bounding Box (Red/Cyan Reticle) -->
    <g filter="url(#glow)">
      <!-- Top Left Corner -->
      <path d="M 170,150 L 140,150 L 140,180" fill="none" stroke="#22d3ee" stroke-width="8" stroke-linecap="round" />
      <!-- Top Right Corner -->
      <path d="M 342,150 L 372,150 L 372,180" fill="none" stroke="#22d3ee" stroke-width="8" stroke-linecap="round" />
      <!-- Bottom Left Corner -->
      <path d="M 140,290 L 140,320 L 170,320" fill="none" stroke="#ef4444" stroke-width="8" stroke-linecap="round" />
      <!-- Bottom Right Corner -->
      <path d="M 372,290 L 372,320 L 342,320" fill="none" stroke="#ef4444" stroke-width="8" stroke-linecap="round" />
    </g>

    <!-- AI Scanner Laser Line -->
    <line x1="100" y1="230" x2="412" y2="230" stroke="url(#laserBeam)" stroke-width="6" filter="url(#glow)" />
  </g>

  <!-- Camera Lens Badge Top Right -->
  <g transform="translate(360, 60)" filter="url(#glow)">
    <circle cx="30" cy="30" r="28" fill="#0f172a" stroke="#22c55e" stroke-width="4" />
    <circle cx="30" cy="30" r="14" fill="#22c55e" />
    <circle cx="26" cy="26" r="4" fill="#ffffff" opacity="0.8" />
  </g>

  <!-- Status Indicator Dots Bottom Left -->
  <circle cx="80" cy="420" r="10" fill="#22c55e" filter="url(#glow)" />
  <circle cx="110" cy="420" r="10" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="140" cy="420" r="10" fill="#ef4444" filter="url(#glow)" />
</svg>
